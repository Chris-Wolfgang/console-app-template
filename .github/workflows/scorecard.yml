name: OSSF Scorecard

# Automated security-posture scoring (issue #220). OpenSSF Scorecard grades the
# repo against a checklist (branch protection, pinned dependencies, token
# permissions, dangerous workflow patterns, ...) and uploads the results as SARIF
# to GitHub Code Scanning (Security → Code scanning). It complements the point
# tools already here: gitleaks (secrets), CodeQL/DevSkim/InspectCode (code),
# zizmor (workflow security) — Scorecard scores the *posture*, not the code.

on:
  # Re-score when branch-protection / ruleset settings change.
  branch_protection_rule:
  schedule:
    - cron: '20 5 * * 1'  # weekly Monday 05:20 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-latest
    if: github.repository != 'Chris-Wolfgang/repo-template'
    permissions:
      # A job-level permissions block REPLACES the workflow-level read-all, so
      # every scope the job needs must be listed here explicitly.
      contents: read           # Scorecard + checkout read the repo
      actions: read            # Scorecard reads workflow files (Token-Permissions / Dangerous-Workflow checks)
      security-events: write   # upload the SARIF to Code Scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # publish_results: false keeps the score private (Code Scanning only).
          # Set to true to publish to the public OpenSSF dashboard and enable the
          # Scorecard badge — that also requires adding `id-token: write` to this
          # job's permissions. Left off by default; flipping it on is a
          # deliberate "make our security posture public" decision.
          publish_results: false

      # Suppress Scorecard checks whose findings are known won't-fix or false
      # positives for this repo, BEFORE the SARIF reaches code-scanning. Doing
      # it here (rather than dismissing individual alerts) makes the suppression
      # durable across weekly re-runs — Scorecard emits a fresh SARIF each run,
      # and fingerprint drift means one-by-one dismissals don't always survive.
      #
      # Suppressed rule IDs (whole rule):
      #   BranchProtectionID   — solo-maintainer repo; approver / codeowner /
      #                          last-push-approval would force admin-bypass on
      #                          every PR without adding a real review gate.
      #   CodeReviewID         — same underlying reason (solo maintainer).
      #   CIIBestPracticesID   — external bestpractices.dev registration; not
      #                          in scope for CI, tracked separately if pursued.
      #   FuzzingID            — this repo is a `dotnet new` template pack, not
      #                          a library that ships runtime code — nothing to
      #                          fuzz. Scorecard's heuristic detects only
      #                          OSS-Fuzz / ClusterFuzzLite integrations.
      #
      # Suppressed PinnedDependenciesID sub-checks (partial rule):
      #   nugetCommand — `dotnet tool install` (ReSharper CLT, DevSkim, etc.)
      #                  and `dotnet restore` are not hash-pinned. Every csproj
      #                  already uses explicit PackageReference Versions (no
      #                  floating), Dependabot's `nuget` ecosystem bumps
      #                  transitives weekly, and no repo in the fleet ships
      #                  packages.lock.json. Adopting `--locked-mode` fleet-wide
      #                  is a separate decision.
      #   pipCommand   — future-proofing: no pip installs today, but if any get
      #                  added (semgrep, zizmor requirements.txt, etc.) they'd
      #                  be dev-time SAST tooling installed from PyPI over
      #                  HTTPS with signed packages. Hash-pinning via
      #                  requirements.txt + --require-hashes needs a pip-tools
      #                  workflow not adopted fleet-wide.
      # gitHubAction rows are NOT suppressed: any regression to an @vN action
      # ref without a SHA pin should still fire on the next scan.
      #
      # NOT suppressed but low (real actionable signal — leave visible):
      #   SASTID           — one older commit escaped CodeQL when the workflow
      #                      was first introduced; a full-history re-run would
      #                      close it. Real signal, not false-positive.
      #   SecurityPolicyID — SECURITY.md exists but Scorecard wants linked
      #                      content (issue #219 addresses this by appending
      #                      the release-path / compromise-scope section from
      #                      Etl-DbClient#240). Naturally clears when that
      #                      merges — not suppressed here.
      #
      # The alerts page still counts every check; suppression only trims the
      # code-scanning-tab noise so real regressions are visible.
      - name: Filter suppressed findings from SARIF
        shell: bash
        env:
          SUPPRESSED_RULES: 'BranchProtectionID CodeReviewID CIIBestPracticesID FuzzingID'
          # Substrings matched against each PinnedDependenciesID result's
          # message text. Order-independent; a single match suppresses.
          SUPPRESSED_PIN_KINDS: 'nugetCommand not pinned|pipCommand not pinned'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not available on the runner; cannot filter SARIF."
            exit 1
          fi
          # Word-split SUPPRESSED_RULES intentionally — one rule per line for the
          # jq -R/-s pipeline. shellcheck's default "quote to prevent globbing"
          # rule (SC2086) would break this.
          # shellcheck disable=SC2086
          rules_json=$(printf '%s\n' $SUPPRESSED_RULES | jq -R . | jq -s .)
          # jq's `not` is a POSTFIX filter, not a prefix operator — the correct
          # form is `(EXPR) | not`, never `not (EXPR)`. Using `and not (...)`
          # yields "jq: error: not/1 is not defined at <top-level>" and the
          # step exits 3 without writing any output.
          jq \
            --argjson suppressed "$rules_json" \
            --arg pinKinds "$SUPPRESSED_PIN_KINDS" \
            '
              .runs |= map(
                .results |= map(select(
                  (.ruleId // "") as $r
                  | (.message.text // "") as $t
                  | (($suppressed | index($r)) == null)
                    and (($r == "PinnedDependenciesID" and ($t | test($pinKinds))) | not)
                ))
              )
            ' scorecard-results.sarif > scorecard-results.filtered.sarif
          before=$(jq '[.runs[].results[]] | length' scorecard-results.sarif)
          after=$(jq '[.runs[].results[]] | length' scorecard-results.filtered.sarif)
          echo "Scorecard SARIF results: $before -> $after after suppression"
          mv scorecard-results.filtered.sarif scorecard-results.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          sarif_file: scorecard-results.sarif
