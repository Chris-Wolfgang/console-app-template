# Native AOT smoke test for the cwconsole-aot template (issue #211).
#
# Packs the AOT template, generates a project from it, publishes a *native* executable
# with Native AOT on Ubuntu (which has the required C toolchain), runs the binary and
# asserts its output. This proves end to end that the template stays AOT-compilable -
# something the analyzer-only check in a normal build cannot fully guarantee.
name: AOT smoke

on:
  pull_request:
    paths:
      - 'src/AotConsoleTemplate/**'
      - '.github/workflows/aot-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/AotConsoleTemplate/**'
      - '.github/workflows/aot-smoke.yml'

permissions:
  contents: read

jobs:
  aot-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, so it cannot ride along in anything this
          # job writes or uploads (zizmor artipacked). Nothing here pushes or fetches again.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack the cwconsole-aot template
        run: dotnet pack src/AotConsoleTemplate/dotnet.consoleapp-aot.template.pack.csproj -c Release -o "$RUNNER_TEMP/pkg"

      - name: Install the template into an isolated hive
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/cli-home
        run: |
          mkdir -p "$DOTNET_CLI_HOME"
          dotnet new install "$RUNNER_TEMP"/pkg/*.nupkg

      - name: Generate a project + publish native
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/cli-home
        run: |
          # `dotnet new` generates into the current directory, so create and enter the
          # project folder first (it does not create a subfolder named after -n).
          app="$RUNNER_TEMP/gen/SmokeAot"
          mkdir -p "$app"
          cd "$app"
          dotnet new cwconsole-aot -n SmokeAot
          # Replace the default "Hello" greeting so the assertion below can only pass if
          # appsettings.json was copied to the output and bound through the source-generated
          # binder - the SampleOptions default would also print "Hello".
          sed -i 's/"Greeting": "Hello"/"Greeting": "Howdy"/' appsettings.json
          grep -q '"Greeting": "Howdy"' appsettings.json
          dotnet publish -c Release -r linux-x64

      - name: Run the native binary and assert output
        run: |
          bin="$(find "$RUNNER_TEMP/gen/SmokeAot" -type f -name SmokeAot -path '*publish*' | head -n1)"
          echo "Native binary: $bin"
          file "$bin"
          # Logs go to stderr (LogToStandardErrorThreshold = Trace in Program.cs), so
          # stdout must be exactly the greeting line; the exact match guards that too.
          out="$("$bin" --name CI)"
          echo "Output: $out"
          if [ "$out" != 'Howdy, CI!' ]; then
            echo "::error::Native AOT binary stdout was not exactly 'Howdy, CI!' (greeting configured in appsettings.json; logs must go to stderr). Full stdout:"
            printf '%s\n' "$out"
            exit 1
          fi
