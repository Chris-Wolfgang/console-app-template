# Fails the build when the app's CLI surface drifts from the committed baseline in
# cli-contract/cli-surface.baseline.json - i.e. an option or subcommand was renamed or
# removed, which breaks scripts and pipelines that call this app. When a change is
# intentional, refresh the baseline locally with:
#   pwsh cli-contract/check-cli-contract.ps1 -Update    (or) bash cli-contract/check-cli-contract.sh --update
# and commit the updated baseline, noting the change in your release notes.
name: CLI contract

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Follows the --framework the project was generated with (net8.0 -> 8.0.x).
          dotnet-version: 8.0.x

      - name: Check CLI surface against baseline
        # Invoke via `bash` rather than `./…` — files generated by `dotnet new` may not
        # carry the executable bit (especially when created/committed from Windows).
        run: bash cli-contract/check-cli-contract.sh
